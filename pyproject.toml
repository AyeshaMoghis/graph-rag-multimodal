[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-multimodal"
version = "0.1.0"
description = "Knowledge-graph-augmented multimodal RAG over PDF corpora"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb==1.5.9",
    "gliner==0.2.30",
    "groq==1.7.0",
    "imagehash==4.3.2",
    "matplotlib==3.11.2",
    "neo4j==6.4.1",
    "numpy==2.5.5",
    "pillow==13.0.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "pymupdf==2.1",
    "pytesseract==0.3.13",
    "rank-bm25==0.2.2",
    "rapidfuzz==3.14.6",
    "sentence-transformers==6.3.0",
    "structlog==26.1.0",
    "torch==2.15.0",
    "tqdm==4.70.1",
    "transformers==5.22.2",
    "typer==0.29.1",
]

[project.optional-dependencies]
dev = [
    "black==26.10.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[project.scripts]
graphrag = "graphrag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/graphrag/cli.py" = ["B008"]  # typer.Option defaults are the Typer idiom

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
packages = ["graphrag"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["graphrag.cli"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs Docker or network; excluded by default with -m 'not slow'"]
