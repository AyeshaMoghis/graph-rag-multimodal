name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Black
        run: black --check src tests
      - name: Mypy
        run: mypy
      - name: Unit tests (no network, no Neo4j)
        run: pytest

  neo4j-integration:
    runs-on: ubuntu-latest
    needs: checks
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_TEST_USER: neo4j
      NEO4J_TEST_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Integration tests against Neo4j
        run: pytest -m slow
